name: Fetch FII DII

on:
  schedule:
    # 18:45, 19:45 and 21:30 IST on weekdays (GitHub uses UTC)
    - cron: "15 13 * * 1-5"
    - cron: "15 14 * * 1-5"
    - cron: "0 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python fetch_fii_dii.py
      - name: Save results
        run: |
          git config user.name "flow-bot"
          git config user.email "flow-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "update FII/DII data" && git push)
